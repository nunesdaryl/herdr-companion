<meta charset="utf-8">
<title>Herdr Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101012; --fg:#ecebe4; --muted:#9a9aa3; --dim:#7c7c85; --faint:#5e5e66;
    --panel:#151518; --card:#1f1f24; --well:#121215; --term:#141417;
    --amber:#e0a03a; --sage:#4fbf7a; --sky:#6aa5e6; --paper:#e9e6dc;
    --sans:Geist,system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{overflow-x:auto}
  a{color:var(--amber);text-decoration:none} a:hover{color:var(--fg)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
  .page{padding:48px 56px 80px;display:flex;flex-direction:column;gap:40px;min-width:2300px}
  .hdr{display:flex;align-items:baseline;gap:18px}
  .eyebrow{font:600 13px var(--mono);color:var(--muted);letter-spacing:.06em}
  .h1{font:600 28px var(--sans);letter-spacing:-.01em}
  .h2{font:600 20px var(--sans)}
  .lede{font:14px var(--sans);color:var(--muted)}
  .row{display:flex;gap:40px;align-items:flex-start}
  .col{width:720px;display:flex;flex-direction:column;gap:18px}
  .col-hdr{display:flex;align-items:center;gap:12px}
  .tag{font:600 12px var(--mono);background:var(--fg);color:var(--bg);border-radius:6px;padding:3px 8px}
  .name{font:600 18px var(--sans)}
  .desc{font:13px var(--sans);color:var(--muted)}
  .scene{position:relative;width:720px;height:420px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:radial-gradient(120% 90% at 20% 110%,#2b2a35 0%,#17171a 55%,#0f0f12 100%)}
  .menubar{position:absolute;inset:0 0 auto 0;height:22px;background:rgba(20,20,24,.7);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 12px;gap:14px;font:500 11px var(--sans);color:#d6d4cc}
  .menubar b{font-weight:700}
  .menubar .clock{margin-left:auto;font-family:var(--mono);font-size:10px}
  .term{position:absolute;left:28px;top:46px;width:400px;height:262px;border-radius:9px;background:var(--term);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;font:10px/1.6 var(--mono);color:#b9b7ad}
  .term-bar{height:24px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1c1c21;border-bottom:1px solid rgba(255,255,255,.06)}
  .term-bar i{width:9px;height:9px;border-radius:50%;background:#3a3a40}
  .term-bar span{margin-left:8px;color:var(--dim)}
  .term-body{display:flex;height:238px}
  .term-side{width:132px;border-right:1px solid rgba(255,255,255,.06);padding:8px 10px;display:flex;flex-direction:column;gap:5px;color:#8f8f98}
  .term-side .lbl{color:var(--faint);font-size:9px}
  .term-side .lbl+.lbl,.term-side .lbl.m{margin-top:6px}
  .term-out{flex:1;padding:8px 12px;white-space:pre;margin:0;font:inherit}
  .g{color:var(--sage)} .a{color:var(--amber)} .o{color:#6b6b74}
  .file{position:absolute;left:462px;top:300px;width:80px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .file .ico{width:36px;height:44px;border-radius:5px;background:var(--paper);border-top-right-radius:12px;position:relative}
  .file .ico i{position:absolute;left:7px;height:2px;background:#b9b5a8}
  .file .ico i:nth-child(1){top:14px;width:22px}.file .ico i:nth-child(2){top:20px;width:16px}.file .ico i:nth-child(3){top:26px;width:20px}
  .file span{font:10px var(--sans);color:#d6d4cc;white-space:nowrap}
  .dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:8px;padding:6px;border-radius:14px;background:rgba(30,30,36,.7);border:1px solid rgba(255,255,255,.08)}
  .dock i{width:34px;height:34px;border-radius:9px;background:#3b3b45}
  .dock i.g{background:#2f4d3b}.dock i.r{background:#4a3b3b}
  .scene-list{position:absolute;right:20px;bottom:128px}
  .scene-pet{position:absolute;right:16px;bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cell{position:relative;height:230px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.07);padding:14px}
  .cell.tall{height:250px} .cell.clip{overflow:hidden}
  .cell-lbl{font:600 11px var(--mono);color:var(--muted);letter-spacing:.04em}
  .pop{position:absolute;left:14px;bottom:14px;background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
  .pop::after{content:"";position:absolute;right:-7px;bottom:34px;width:14px;height:14px;background:var(--card);border-right:1px solid rgba(255,255,255,.09);border-top:1px solid rgba(255,255,255,.09);transform:rotate(45deg)}
  .pop-title{display:flex;align-items:center;gap:7px;font:600 12px var(--sans)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.s{width:7px;height:7px} .dot.hollow{border:2px solid #6b6b74;box-sizing:border-box;background:none}
  .cmd{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--well);font:11px var(--mono);color:var(--paper)}
  .hint{margin-top:6px;font:11px var(--sans);color:var(--muted)}
  .btns{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:rgba(255,255,255,.07);font:500 12px var(--sans);white-space:nowrap;color:var(--fg);border:0;cursor:pointer;font-family:var(--sans)}
  .btn.primary{background:var(--sage);color:#0f1a14;font-weight:600}
  .cell-pet{position:absolute;right:8px;bottom:10px}
  .pick{display:flex;flex-direction:column;gap:2px;font:12px var(--sans)}
  .pick div{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px}
  .pick div.on{background:rgba(255,255,255,.08)}
  .pick b{font-weight:600} .pick span{color:var(--muted)}
  .thrown{position:absolute;right:58px;bottom:62px;width:28px;height:34px;border-radius:4px;border-top-right-radius:10px;background:var(--paper);transform:rotate(-12deg);box-shadow:0 8px 16px rgba(0,0,0,.4)}
  .chat{display:flex;flex-direction:column;gap:8px;padding:10px}
  .bub{max-width:80%;padding:7px 10px;font:12px/1.4 var(--sans)}
  .bub.me{align-self:flex-end;border-radius:12px 12px 4px 12px;background:var(--fg);color:var(--bg)}
  .bub.them{align-self:flex-start;max-width:88%;border-radius:12px 12px 12px 4px;background:#2a2a31}
  .input{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--well);border:1px solid rgba(255,255,255,.06);font:12px var(--sans);color:var(--dim)}
  .input i{margin-left:auto;width:16px;height:16px;border-radius:5px;background:var(--sage)}
  .os{display:flex;flex-direction:column;gap:10px}
  .os-lbl{font:600 12px var(--mono);color:var(--muted)}
  .os-scene{position:relative;width:600px;height:360px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .os-scene.win{background:radial-gradient(100% 80% at 70% 0%,#243044 0%,#141821 60%,#0d0f14 100%)}
  .os-scene.lin{background:radial-gradient(100% 80% at 30% 100%,#3a2a2e 0%,#1a1618 55%,#0f0e0f 100%)}
  .os-scene.ph{width:240px;background:radial-gradient(100% 70% at 50% 0%,#2b2a35 0%,#17171a 60%,#0f0f12 100%)}
  .picker{display:flex;align-items:center;gap:8px;margin-left:auto;font:12px var(--sans);color:var(--muted)}
  .picker button{font:500 12px var(--mono);background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:4px 10px;cursor:pointer}
  .picker button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  /* Mascot */
  .m{position:relative;width:120px;height:110px;font-family:var(--sans)}
  .m *{position:absolute}
  @media (prefers-reduced-motion:no-preference){
    .m.idle .breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
    @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97)}}
  }
</style>

<div class="page">
  <div class="hdr">
    <div class="eyebrow">TURN 1</div>
    <div class="h1">herdr companion · three characters, one behavior</div>
    <div class="lede">The card above the character is the same across <a href="#1a">1a</a>–<a href="#1c">1c</a>; only the character changes. OS variants below follow the Tweaks character.</div>
  </div>

  <div class="row" id="characters"></div>

  <div class="hdr" style="margin-top:16px">
    <div class="eyebrow">ANY OS</div>
    <div class="h2">Same herd, wherever the tty is</div>
    <div class="lede">Character follows the Tweaks setting.</div>
    <div class="picker" role="group" aria-label="Tweaks character">Tweaks
      <button type="button" data-kind="collie" aria-pressed="true">collie</button>
      <button type="button" data-kind="ewe" aria-pressed="false">ewe</button>
      <button type="button" data-kind="cursor" aria-pressed="false">cursor</button>
    </div>
  </div>
  <div class="row" id="os"></div>
</div>

<script>
/* ---------- Mascot: kind = collie | ewe | cursor, mood = idle | alert | catch ---------- */
function mascot(kind = 'collie', mood = 'idle', zoom = 1) {
  const alert = mood === 'alert', catchM = mood === 'catch';
  const headRot = alert ? -8 : catchM ? 6 : 0;
  const earL = alert ? -30 : 0, earR = alert ? 30 : 0;
  const tailRot = alert ? -40 : -20;
  const squash = catchM ? 0.88 : 1;
  const pupil = alert ? 4 : 3;
  const mouthW = alert ? 6 : catchM ? 14 : 10;
  const eye = (l, t, w, h, r, bg, pbg, ps) =>
    `<div style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;border-radius:${r};background:${bg}"><div style="left:${pupil}px;top:3px;width:${ps}px;height:${ps}px;border-radius:50%;background:${pbg}"></div></div>`;
  let body = '';
  if (kind === 'collie') body = `
    <div style="left:8px;top:40px;width:14px;height:36px;border-radius:7px;background:#f4f1e8;transform:rotate(${tailRot}deg);transform-origin:50% 90%"><div style="top:0;left:0;width:14px;height:12px;border-radius:7px 7px 3px 3px;background:#1d1d21"></div></div>
    <div style="left:24px;top:88px;width:11px;height:20px;border-radius:0 0 5px 5px;background:#f4f1e8"></div>
    <div style="left:40px;top:88px;width:11px;height:20px;border-radius:0 0 5px 5px;background:#1d1d21"></div>
    <div style="left:72px;top:88px;width:11px;height:20px;border-radius:0 0 5px 5px;background:#f4f1e8"></div>
    <div style="left:88px;top:88px;width:11px;height:20px;border-radius:0 0 5px 5px;background:#1d1d21"></div>
    <div class="breathe" style="left:16px;top:44px;width:90px;height:56px;border-radius:50%;background:#f4f1e8;transform:scaleY(${squash});transform-origin:50% 100%"><div style="left:44px;top:-2px;width:44px;height:38px;border-radius:50%;background:#1d1d21"></div><div style="left:6px;top:8px;width:26px;height:22px;border-radius:50%;background:#1d1d21"></div></div>
    <div style="left:52px;top:8px;width:62px;height:54px;border-radius:50% 50% 46% 46%;background:#1d1d21;transform:rotate(${headRot}deg);transform-origin:40% 100%">
      <div style="left:-6px;top:6px;width:18px;height:26px;border-radius:9px;background:#1d1d21;transform:rotate(${earL}deg);transform-origin:50% 10%"></div>
      <div style="left:50px;top:6px;width:18px;height:26px;border-radius:9px;background:#1d1d21;transform:rotate(${earR}deg);transform-origin:50% 10%"></div>
      <div style="left:25px;top:0;width:12px;height:54px;border-radius:6px;background:#f4f1e8"></div>
      <div style="left:14px;top:30px;width:34px;height:24px;border-radius:50%;background:#f4f1e8"></div>
      ${eye(12,19,11,11,'50%','#fff','#111',5)}
      ${eye(39,19,11,11,'50%','#fff','#111',5)}
      <div style="left:27px;top:38px;width:8px;height:6px;border-radius:4px;background:#111"></div>
    </div>`;
  else if (kind === 'ewe') body = `
    <div style="left:30px;top:90px;width:7px;height:18px;border-radius:0 0 3px 3px;background:#1d1d21"></div>
    <div style="left:46px;top:90px;width:7px;height:18px;border-radius:0 0 3px 3px;background:#1d1d21"></div>
    <div style="left:68px;top:90px;width:7px;height:18px;border-radius:0 0 3px 3px;background:#1d1d21"></div>
    <div style="left:84px;top:90px;width:7px;height:18px;border-radius:0 0 3px 3px;background:#1d1d21"></div>
    <div class="breathe" style="left:16px;top:40px;width:92px;height:60px;transform:scaleY(${squash});transform-origin:50% 100%">
      <div style="left:0;top:10px;width:92px;height:50px;border-radius:40px;background:#f4f1e8"></div>
      <div style="left:4px;top:0;width:30px;height:30px;border-radius:50%;background:#f4f1e8"></div>
      <div style="left:30px;top:-6px;width:34px;height:34px;border-radius:50%;background:#f4f1e8"></div>
      <div style="left:60px;top:0;width:28px;height:28px;border-radius:50%;background:#f4f1e8"></div>
      <div style="left:8px;top:30px;width:76px;height:22px;border-radius:50%;background:#e6e1d3;opacity:.7"></div>
    </div>
    <div style="left:78px;top:24px;width:38px;height:46px;border-radius:14px 14px 16px 16px;background:#1d1d21;transform:rotate(${headRot}deg);transform-origin:30% 100%">
      <div style="left:-12px;top:10px;width:16px;height:9px;border-radius:5px;background:#1d1d21;transform:rotate(${earL}deg)"></div>
      <div style="left:34px;top:10px;width:16px;height:9px;border-radius:5px;background:#1d1d21;transform:rotate(${earR}deg)"></div>
      <div style="left:4px;top:-12px;width:30px;height:22px;border-radius:50%;background:#f4f1e8"></div>
      ${eye(6,16,10,10,'50%','#fff','#111',4)}
      ${eye(22,16,10,10,'50%','#fff','#111',4)}
      <div style="left:14px;top:34px;width:10px;height:5px;border-radius:3px;background:#3a3a40"></div>
    </div>`;
  else body = `
    <div style="left:22px;top:104px;width:76px;height:5px;border-radius:3px;background:#2c5c42"></div>
    <div class="breathe" style="left:30px;top:18px;width:60px;height:84px;border-radius:8px;background:#4fbf7a;box-shadow:0 0 22px rgba(79,191,122,.35);transform:rotate(${headRot}deg) scaleY(${squash});transform-origin:50% 100%">
      ${eye(12,22,10,16,'4px','#0f1a14','#dff5e7',4)}
      ${eye(38,22,10,16,'4px','#0f1a14','#dff5e7',4)}
      <div style="left:24px;top:52px;width:${mouthW}px;height:4px;border-radius:2px;background:#0f1a14"></div>
    </div>`;
  const badge = alert ? `<div style="left:100px;top:0;width:20px;height:20px;border-radius:50%;background:#e0a03a;color:#1a1408;font:700 12px/20px var(--mono);text-align:center;box-shadow:0 0 0 3px #17171a">1</div>` : '';
  return `<div class="m ${mood}" role="img" aria-label="${kind} mascot, ${mood}" style="zoom:${zoom}">${body}${badge}</div>`;
}

/* ---------- AgentList: variant = default | blocked | deploying | done | paused ---------- */
function agentList(variant = 'default', zoom = 1) {
  const blocked = variant === 'blocked', deploying = variant === 'deploying', done = variant === 'done', paused = variant === 'paused';
  const summary = blocked ? '1 needs you' : paused ? '2 working · 1 paused' : '3 working · 1 idle';
  const row = (dot, name, eng, line, status, statusColor, extra = '', lineColor = 'var(--muted)') => `
    <div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid rgba(255,255,255,.06)${extra}">
      ${dot}
      <div style="flex:1;min-width:0"><div style="font:600 12px var(--sans)">${name} <span style="color:var(--muted);font-weight:500">· ${eng}</span></div><div style="font:11px var(--mono);color:${lineColor};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${line}</div></div>
      ${status}
    </div>`;
  const live = `<div class="dot" style="background:var(--sage);box-shadow:0 0 8px rgba(79,191,122,.6)"></div>`;
  const st = (t, c) => `<div style="font:11px var(--mono);color:${c}">${t}</div>`;
  let web;
  if (blocked) web = row(`<div class="dot" style="background:var(--amber);box-shadow:0 0 0 3px rgba(224,160,58,.25)"></div>`, 'web-dashboard', 'claude', 'wants to run wrangler deploy', st('blocked','var(--amber)'), '', ';background:rgba(224,160,58,.08)', 'var(--amber)');
  else if (done) web = row(`<div class="dot" style="background:var(--sky)"></div>`, 'web-dashboard', 'claude', 'deployed to staging · 41.2 kB', st('done','var(--sky)'));
  else web = row(live, 'web-dashboard', 'claude', deploying ? 'deploying to staging…' : 'writing UsageChart.tsx', st('working','var(--sage)'));
  const pipe = paused
    ? row(`<div class="dot" style="border:2px solid var(--muted);box-sizing:border-box"></div>`, 'data-pipeline', 'codex', 'paused at batch 4,127 · 68%',
        `<div style="display:flex;gap:6px">
          <button type="button" aria-label="Resume data-pipeline" style="width:24px;height:24px;border-radius:7px;background:var(--sage);border:0;display:grid;place-items:center;cursor:pointer;padding:0"><div style="width:0;height:0;border-left:9px solid #0f1a14;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px"></div></button>
          <button type="button" aria-label="Stop data-pipeline" style="width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.08);border:0;display:grid;place-items:center;cursor:pointer;padding:0"><div style="width:9px;height:9px;border-radius:2px;background:var(--fg)"></div></button>
        </div>`, ';background:rgba(255,255,255,.04)')
    : row(live, 'data-pipeline', 'codex · workbox', 'batch 4,106 ok · 68% · eta 2h 54m', st('working','var(--sage)'));
  return `
  <div style="width:300px;background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:var(--sans);color:var(--fg);overflow:hidden;zoom:${zoom}">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 14px 8px">
      <div style="font:600 12px var(--sans);letter-spacing:.02em">the herd</div>
      <div style="font:11px var(--mono);color:var(--muted)">3 machines</div>
      <div style="margin-left:auto;font:11px var(--mono);color:var(--muted)">${summary}</div>
    </div>
    ${row(live, 'herdr', 'claude', 'editing css/style.css', st('working','var(--sage)'))}
    ${web}${pipe}
    ${row(`<div class="dot hollow"></div>`, 'explore', 'opencode', 'idle · waiting for a prompt', st('idle','#6b6b74'))}
  </div>`;
}

/* ---------- Turn 1: the three characters ---------- */
const CHARS = [
  { id:'1a', kind:'collie', name:'Pup',   desc:'A sheepdog. Literal herder, ears tell you the state.', mood:'idle', list:'default', cwd:'~/Projects',
    side:`<div class="lbl">agents</div><div><span class="g">●</span> herdr</div><div><span class="g">●</span> web-dashboard</div><div><span class="g">●</span> data-pipeline</div><div><span class="o">○</span> explore</div><div class="lbl m">machines</div><div>local · workbox</div>`,
    out:`❯ make the hero mock match real claude code
● Read the real pane over the socket.
● Plan:
  · index.html — swap the mark, bump version
  · css/style.css — coral bypass line
⠋ Baking… (13m 36s · esc to interrupt)` },
  { id:'1b', kind:'ewe', name:'Ewe', desc:'One of the herd. Soft, round, sits quietly in the corner.', mood:'alert', list:'blocked', cwd:'~/Projects',
    side:`<div class="lbl">agents</div><div><span class="g">●</span> herdr</div><div><span class="a">◉</span> web-dashboard</div><div><span class="g">●</span> data-pipeline</div><div><span class="o">○</span> explore</div><div class="lbl m">machines</div><div>local · workbox</div>`,
    out:`❯ finish the usage chart, ship to staging
● Wrote src/components/UsageChart.tsx
● Typecheck and build clean, 41.2 kB gzipped.

Bash command
  bunx wrangler deploy --env staging
Do you want to proceed?
❯ 1. Yes
  2. No, tell Claude what to do differently` },
  { id:'1c', kind:'cursor', name:'Blink', desc:'A block cursor with eyes. Terminal-native, no animal metaphor.', mood:'idle', list:'deploying', cwd:'~/data-pipeline',
    side:`<div class="lbl">agents</div><div><span class="g">●</span> herdr</div><div><span class="g">●</span> web-dashboard</div><div><span class="g">●</span> data-pipeline</div><div><span class="o">○</span> explore</div><div class="lbl m">machines</div><div>local · workbox</div>`,
    out:`❯ uv run jobs/backfill_events.py
02:28:41 batch 4,102 ok  20,510,000 rows
02:29:03 batch 4,103 ok  checkpoint written
